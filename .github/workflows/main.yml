name: Main CI

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "imgs/**"
    branches:
      - main
  push:
    paths-ignore:
      - "README.md"
      - "imgs/**"
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: qupid
          python-version: ${{ matrix.python-version }}

      - name: Install conda packages
        shell: bash -l {0}
        run: conda install -c conda-forge pandas pytest pytest-cov scipy scikit-bio networkx joblib h5py

      - name: Install qupid
        shell: bash -l {0}
        run: pip install -e .[dev]

      - name: Check style
        shell: bash -l {0}
        run: make standalone_stylecheck

      - name: Run tests
        shell: bash -l {0}
        run: make standalone_test
